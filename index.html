<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <a href="#" class="logo">🍳 Recipe Book</a>
            <nav class="nav">
                <a href="#" class="nav__link" id="homeLink">Home</a>
                <a href="#" class="nav__link" id="favLink">Favorites (<span id="favCount">0</span>)</a>
            </nav>
            <button class="btn btn--primary" id="addRecipeBtn">+ Add recipe</button>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h1 id="pageTitle">All recipes</h1>
            <p id="pageMeta" class="muted">Loading…</p>
        </section>

        <section class="controls">
            <input type="search" id="searchInput" class="input" placeholder="Search recipes…">
            <select id="tagSelect" class="input"><option value="">All tags</option></select>
            <select id="mealSelect" class="input">
                <option value="">All meals</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
            </select>
            <select id="sortSelect" class="input">
                <option value="">Sort: default</option>
                <option value="name-asc">Name A–Z</option>
                <option value="rating-desc">Best rating</option>
                <option value="cookTime-asc">Fastest</option>
            </select>
            <button class="btn btn--ghost" id="clearFilters" hidden>Clear ✕</button>
        </section>

        <section id="recipeGrid" class="grid"></section>

        <div id="emptyState" class="empty" hidden>
            <span class="empty__icon">🍽️</span>
            <h3 id="emptyTitle">No recipes found</h3>
            <p id="emptyText" class="muted">Try a different search or filter.</p>
        </div>

        <nav id="pagination" class="pagination"></nav>
    </main>

    <div class="modal" id="recipeModal" hidden>
        <div class="modal__backdrop" data-close></div>
        <div class="modal__panel">
            <button class="modal__close" data-close aria-label="Close">✕</button>
            <div id="recipeDetail"></div>
        </div>
    </div>

    <div class="modal" id="addModal" hidden>
        <div class="modal__backdrop" data-close></div>
        <div class="modal__panel">
            <button class="modal__close" data-close aria-label="Close">✕</button>
            <h2 class="modal__title">Add your recipe</h2>
            <form id="addForm" novalidate>
                <label class="field"><span>Name *</span>
                    <input type="text" name="name" class="input">
                    <em class="error" data-error="name"></em>
                </label>
                <label class="field"><span>Cuisine *</span>
                    <input type="text" name="cuisine" class="input" placeholder="e.g. Italian">
                    <em class="error" data-error="cuisine"></em>
                </label>
                <label class="field"><span>Difficulty *</span>
                    <select name="difficulty" class="input">
                        <option value="">Choose…</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                    </select>
                    <em class="error" data-error="difficulty"></em>
                </label>
                <label class="field"><span>Ingredients * (one per line)</span>
                    <textarea name="ingredients" class="input" rows="4" placeholder="2 eggs&#10;1 cup flour"></textarea>
                    <em class="error" data-error="ingredients"></em>
                </label>
                <label class="field"><span>Instructions *</span>
                    <textarea name="instructions" class="input" rows="4" placeholder="Mix everything&#10;Bake for 20 minutes"></textarea>
                    <em class="error" data-error="instructions"></em>
                </label>
                <button type="submit" class="btn btn--primary btn--block">Save recipe</button>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="main.js"></script>
</body>
</html>
